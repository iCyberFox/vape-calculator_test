<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор флейвор шоту</title>
<link rel="stylesheet" href="FlavorShotCalculator.css">

<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="calculator">
  <h1>Калькулятор флейвор шоту</h1>
  <button class="btn-back" onclick="window.location.href='../index.html'" style="margin-top: 10px; margin-bottom: 20px; display: block; margin-left: auto; margin-right: auto; background-color: #7f8c8d; padding: 10px 20px; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; transition: background-color 0.3s;">← Повернутися на головну</button>

  <div class="form-group">
    <label for="shotVolume">Обʼєм шоту (мл):</label>
    <input type="number" id="shotVolume" value="10" min="1">
  </div>

  <div class="total-percent">Сумарний %: 0%</div>

  <div id="flavors">
    <div class="flavor-row">
      <input type="text" placeholder="Ароматизатор" class="flavorName" value="Ароматизатор">
      <div class="input-percent-wrapper">
        <input type="number" placeholder="ароматизатора" class="flavorPercent" min="0" max="100" step="0.1">
      </div>
      <button class="btn-remove removeFlavor">×</button>
    </div>
  </div>

  <button id="addFlavor" class="btn-add">Додати ароматизатор +</button>
  <button id="calculate">Розрахувати</button>

  <div class="result" id="result">
    <h3>Результат:</h3>
    <div id="resultContent"></div>
  </div>
<div class="copyright">
    By <a href="https://t.me/BMWeast523" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-telegram"></i> <strong>BMWeast</strong>
    </a>
</div>
</div>
<script src="FlavorShotCalculator.js"></script>
<script>
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('../service-worker.js')
                .then(reg => console.log('Service worker registered:', reg.scope))
                .catch(err => console.warn('SW registration failed:', err));
        });
    }
</script>

</body>
</html>
