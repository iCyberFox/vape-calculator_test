<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Флейвор шот калькулятор</title>
<link rel="stylesheet" href="GeneralFlavorShotCalculator.css">

<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

</head>
<body>
<div class="calculator">
<h1>Флейвор шот калькулятор</h1>
<button class="btn-back" onclick="window.location.href='../index.html'" style="margin-top: 10px; margin-bottom: 20px; display: block; margin-left: auto; margin-right: auto; background-color: #7f8c8d; padding: 10px 20px; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; transition: background-color 0.3s;">← Повернутися на головну</button>

<div id="flavors">
  <div class="flavor-row">
    <div class="flavor-input-wrapper">
      <label>Назва ароматизатора</label>
      <input type="text" class="flavorName" value="Ароматизатор">
    </div>
    <div class="flavor-input-wrapper input-ml-wrapper">
      <label>Обʼєм (мл.)</label>
      <input type="number" class="flavorVolume" value="10" min="0" step="0.1">
    </div>
    <div class="flavor-input-wrapper input-percent-wrapper">
      <label>Концентрація (%)</label>
      <input type="number" class="flavorPercent" value="1" min="0" max="100" step="0.1">
    </div>
    <button class="btn-remove">✖</button>
  </div>
</div>

<button class="btn-add">Додати ароматизатор</button>
<button id="calculate">Розрахувати шот</button>

<div class="result" id="result">
  <h3>Результат:</h3>
  <p id="maxVolume"></p>
  <div id="usage"></div>
  <div id="leftovers"></div>
</div>
<div class="copyright">
    By <a href="https://t.me/BMWeast523" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-telegram"></i> <strong>BMWeast</strong>
    </a>
</div>

<script src="GeneralFlavorShotCalculator.js"></script>
<script>
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('../service-worker.js')
                .then(reg => console.log('Service worker registered:', reg.scope))
                .catch(err => console.warn('SW registration failed:', err));
        });
    }
</script>
</body>
</html>
