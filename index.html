<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятори для вейпінгу</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3498db">
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> 
</head>
<body>
    <div class="calculator">
        <h1>Вейп Калькулятори</h1>
        
        <div class="btn-container">
            <!-- Перша кнопка - Калькулятор вейп-рідини -->
            <button class="btn-vape" onclick="window.location.href='FlavorCalculator/FlavorCalculator.html'">
                Калькулятор вейп-рідини
            </button>

            <!-- Друга кнопка - Калькулятор змішування основ -->
            <button class="btn-base" onclick="window.location.href='VapeCalculatorSlider/VapeCalculatorSlider.html'">
                Калькулятор змішування основ
            </button>

            <!-- Третя кнопка - Підвищення концентрації ароматизаторів -->
            <button class="btn-flavor" onclick="window.location.href='FlavorBoostCalculator/FlavorBoostCalculator.html'">
                Підвищення концетрації ароматизаторів
            </button>

            <!-- Нова кнопка - Калькулятор флейвор шот по рецепту -->
            <button class="btn-flavor-shot" onclick="window.location.href='FlavorShotCalculator/FlavorShotCalculator.html'">
                Калькулятор флейвор шот по рецепту
            </button>

            <!-- Нова кнопка - Загальний флейвор шот калькулятор -->
            <button class="btn-flavor-shot-2" onclick="window.location.href='General Flavor Shot Calculator/GeneralFlavorShotCalculator.html'">
                Загальний флейвор шот калькулятор
            </button>

            <!-- Кнопка - Калькулятор намотки спіралі -->
            <button class="btn-coil" onclick="window.location.href='CoilCalculator/CoilCalculator.html'">
                Калькулятор намотки спіралі
            </button>
        </div>
        
        <div class="description">
            <p>Оберіть потрібний калькулятор для розрахунку параметрів вашої вейп-рідини. Кожен калькулятор спеціалізований для вирішення конкретних завдань при приготуванні рідини.</p>
        </div>
        
        <div class="copyright">
            By <a href="https://t.me/BMWeast523" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-telegram"></i> <strong>BMWeast</strong>
            </a>
        </div>
    </div>
    <script>
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service worker registered:', reg.scope))
                    .catch(err => console.warn('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
